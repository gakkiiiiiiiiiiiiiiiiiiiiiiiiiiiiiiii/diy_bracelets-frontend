name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Install pnpm
        run: npm install --global pnpm@10.17.0 --ignore-scripts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build H5
        run: pnpm build:h5

      - name: Build WeChat mini program
        run: pnpm build:mp-weixin
        env:
          VITE_API_BASE: https://api.example.test
          VITE_STATIC_BASE: https://static.example.test
          VITE_WECHAT_APP_ID: wx0000000000000000

      - name: Check WeChat package size
        run: pnpm check:mp-size

      - name: Build static runtime image
        run: docker build --build-arg VITE_API_BASE=https://api.example.test -t diy-bracelets-frontend:ci .

      - name: Smoke test static runtime image
        run: |
          docker run --rm -d --name diy-bracelets-frontend-ci -p 127.0.0.1:18080:8080 diy-bracelets-frontend:ci
          trap 'docker rm -f diy-bracelets-frontend-ci >/dev/null 2>&1 || true' EXIT
          for attempt in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:18080/health && break
            sleep 1
          done
          curl --fail --silent --head http://127.0.0.1:18080/static/materials/reference-crystals/manifest.json | grep -i 'access-control-allow-origin: \*'

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate
